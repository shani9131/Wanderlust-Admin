<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Wanderlust Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { display: flex; height: 100vh; background-color: #f3f4f6; align-items: center; justify-content: center;}

        .recovery-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 450px; }
        .recovery-box h2 { font-size: 24px; color: #111827; margin-bottom: 10px; text-align: center;}
        .recovery-box p { color: #6b7280; font-size: 14px; text-align: center; margin-bottom: 25px;}

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; }
        .input-group input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        .btn-primary { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s;}
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #10b981; }
        .btn-secondary:hover { background: #059669; }

        .back-link { text-align: center; margin-top: 20px; font-size: 14px; }
        .back-link a { color: #6b7280; text-decoration: none; font-weight: 500; }
        .back-link a:hover { color: #111827; }

        /* Step 2 initially hidden */
        #step2 { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px dashed #d1d5db;}
        .question-text { font-size: 16px; font-weight: bold; color: #b45309; margin-bottom: 15px; background: #fef3c7; padding: 10px; border-radius: 6px;}
    </style>
</head>
<body>

    <div class="recovery-box">
        <h2>Account Recovery</h2>
        <p>Follow the steps to reset your password</p>

        <div id="step1">
            <div class="input-group">
                <label>Enter your Username</label>
                <input type="text" id="searchUsername" placeholder="e.g., Rahul1">
            </div>
            <button class="btn-primary" onclick="fetchQuestion()">Search Account</button>
        </div>

        <div id="step2">
            <div class="question-text" id="displayQuestion">Loading question...</div>
            
            <div class="input-group">
                <label>Your Answer</label>
                <input type="text" id="securityAnswer" placeholder="Type your answer here">
            </div>
            <div class="input-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password">
            </div>
            <button class="btn-primary btn-secondary" onclick="resetPassword()">Reset Password</button>
        </div>

        <div class="back-link">
            <a href="index.html">← Back to Login</a>
        </div>
    </div>

    <script>
        let currentUsername = "";

        // 1. Fetch Question from DB
        function fetchQuestion() {
            const username = document.getElementById('searchUsername').value;
            if(!username) { alert("Please enter username"); return; }

            fetch(`https://wanderlust-admin.onrender.com/api/auth/question/${username}`)
            .then(res => res.text())
            .then(data => {
                if(data === "User not found") {
                    alert("No account found with this username!");
                } else {
                    // Agar user mil gaya toh Step 2 dikhao
                    currentUsername = username;
                    document.getElementById('displayQuestion').innerText = "Q: " + data;
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                }
            }).catch(err => console.error(err));
        }

        // 2. Verify Answer and Update Password
        function resetPassword() {
            const answer = document.getElementById('securityAnswer').value;
            const newPassword = document.getElementById('newPassword').value;

            if(!answer || !newPassword) { alert("Please fill all fields"); return; }

            const data = {
                username: currentUsername,
                answer: answer,
                password: newPassword
            };

            fetch('https://wanderlust-admin.onrender.com/api/auth/update-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.text())
            .then(msg => {
                alert(msg);
                if(msg === "Password updated successfully!") {
                    window.location.href = 'index.html'; // Password reset ke baad wapas login pe bhej do
                }
            }).catch(err => console.error(err));
        }
    </script>
</body>
</html>
