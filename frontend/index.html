<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanderlust Admin - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { display: flex; height: 100vh; background-color: #f3f4f6; }

        /* Left Side: Beautiful Image */
        .image-side { flex: 1; background: url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center; background-size: cover; position: relative; }
        .image-overlay { position: absolute; inset: 0; background: linear-gradient(to right, rgba(0,0,0,0.4), rgba(0,0,0,0.1)); display: flex; flex-direction: column; justify-content: flex-end; padding: 50px; color: white; }
        .image-overlay h1 { font-size: 48px; font-weight: bold; margin-bottom: 10px; }
        .image-overlay p { font-size: 18px; opacity: 0.9; }

        /* Right Side: Clean Form */
        .form-side { flex: 1; display: flex; align-items: center; justify-content: center; background: white; max-width: 600px; }
        .login-box { width: 100%; max-width: 400px; padding: 40px; }
        .login-box h2 { font-size: 28px; color: #111827; margin-bottom: 10px; }
        .login-box p { color: #6b7280; margin-bottom: 30px; font-size: 15px; }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; outline: none; transition: 0.2s; }
        .input-group input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }

        .options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; font-size: 13px; }
        .options a { color: #3b82f6; text-decoration: none; font-weight: 500; }
        .options a:hover { text-decoration: underline; }

        .btn-primary { width: 100%; background: #2563eb; color: white; border: none; padding: 14px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary:hover { background: #1d4ed8; }

        .signup-link { text-align: center; margin-top: 25px; font-size: 14px; color: #6b7280; }
        .signup-link a { color: #3b82f6; text-decoration: none; font-weight: bold; }
        
        .error-msg { color: #dc2626; font-size: 13px; margin-bottom: 15px; display: none; text-align: center; background: #fee2e2; padding: 10px; border-radius: 6px;}
    </style>
</head>
<body>

    <div class="image-side">
        <div class="image-overlay">
            <h1>Wanderlust Admin</h1>
            <p>Enterprise Travel Management System</p>
        </div>
    </div>

    <div class="form-side">
        <div class="login-box">
            <h2>Welcome Back</h2>
            <p>Please enter your staff details to sign in.</p>

            <div class="error-msg" id="errorMsg">Invalid Credentials</div>

            <form id="loginForm">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <div class="options">
                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="forgot_password.html">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary">Sign In</button>
            </form>

            <div class="signup-link">
                New staff member? <a href="signup.html">Create an account</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            fetch('https://wanderlust-admin.onrender.com/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            })
            .then(res => res.text())
            .then(data => {
                if(data === "Success") {
                    localStorage.setItem('loggedInUser', user);
                    window.location.href = 'dashboard.html';
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                }
            }).catch(err => console.error(err));
        });
    </script>
</body>
</html>
